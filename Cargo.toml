[package]
name = "xturing"
version = "0.1.0"
edition = "2024"
description = "Terminal UI (ratatui) for the equisdots settings panel"
license = "MIT"
repository = "https://github.com/equisdots/xturing"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
